<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скоро вернусь — Фотограф</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=DM+Serif+Display:ital@0;1&family=Bad+Script&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      padding: 2rem;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.8s ease-out;
    }

    /* Camera icon — drawn in CSS, no external assets */
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      border-radius: 12px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-lens {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #5c6a42;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-lens::before {
      content: '';
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #5c6a42;
      opacity: 0.15;
    }

    .icon::after {
      content: '';
      position: absolute;
      top: 18px;
      right: 22px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #5c6a42;
      opacity: 0.08;
    }

    h1 {
      font-family: 'Bad Script', cursive;
      font-size: 2rem;
      font-weight: 400;
      color: #1a1a1a;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #666666;
      margin-bottom: 0.5rem;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: #e0e0e0;
      margin: 1.5rem auto;
      border-radius: 1px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: #f5f5f5;
      border-radius: 20px;
      font-size: 0.8125rem;
      color: #999999;
      margin-top: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e0e0e0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .status-dot {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.625rem; }
      body { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true">
      <div class="icon-lens"></div>
    </div>

    <h1>Скоро вернусь</h1>

    <p>
      Сервер временно недоступен.<br>
      Возможно, ведутся технические работы.
    </p>

    <div class="divider"></div>

    <p>
      Загляните чуть позже — сайт снова заработает<br>
      в самое ближайшее время.
    </p>

    <div class="status">
      <span class="status-dot"></span>
      Ожидание подключения…
    </div>
  </div>
</body>
</html>
